name: Request Publish Label

# 提出者の多くはこのリポジトリへの書き込み権限（write/triage）を持たずPRを直接マージ
# できないため、代わりにマーカー付きのコメントで「公開をリクエスト」する
# （RelationalDocumentsアプリの「公開をリクエスト」ボタンがこのコメントを自動投稿する）。
# このワークフローはそのコメントを検知し、リポジトリの権限でrequest-publishラベルを
# 付与することで、オーナー・メンテナがマージ待ちのPRをひと目で見つけられるようにする。
#
# ラベル付与にはコメント投稿より高い権限（triage以上）が必要なため、提出者自身のトークンでは
# 直接ラベルを付けられない。そのためコメント投稿はアプリ（提出者のPAT）、ラベル付与は
# このワークフロー（リポジトリ自身のGITHUB_TOKEN）という役割分担にしている

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write

jobs:
  label:
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Add request-publish label if requested by the PR author
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- relational-documents:request-publish -->';
            const LABEL = 'request-publish';
            const comment = context.payload.comment;
            const issue = context.payload.issue;

            if (!comment.body.includes(MARKER)) {
              core.info('マーカーが含まれていないコメントのため無視します');
              return;
            }

            // 第三者が偽装コメントを投稿してもラベルが付かないよう、PR作成者本人の
            // コメントのみを受け付ける
            if (comment.user.login !== issue.user.login) {
              core.info(
                `コメント投稿者（${comment.user.login}）がPR作成者（${issue.user.login}）と一致しないため無視します`,
              );
              return;
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: LABEL,
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: LABEL,
                color: 'fbca04',
                description: '提出者がCI合格を確認し、公開（マージ）をリクエストしたPR',
              });
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [LABEL],
            });
